<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library Management System</title>

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50:'#eef2ff',100:'#e0e7ff',500:'#6366f1',600:'#4f46e5',700:'#4338ca' }
          }
        }
      }
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f9fafb; }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes slideIn { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:translateX(0); } }
    .spin     { animation: spin    0.75s linear   infinite; }
    .toast-in { animation: slideIn 0.22s ease-out forwards; }

    ::-webkit-scrollbar       { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:#f1f5f9; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }

    /* Bootstrap-style loading screen */
    #boot {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:16px;
      background:#f9fafb; z-index:9999; font-family:inherit;
    }
    #boot p { color:#6b7280; font-size:14px; }
  </style>
</head>

<body>
  <!-- Shown while CDN scripts and the app are loading -->
  <div id="boot">
    <div class="spin" style="width:36px;height:36px;border:3px solid #e0e7ff;border-top-color:#4f46e5;border-radius:50%;"></div>
    <p id="boot-msg">Loading dependencies…</p>
  </div>

  <div id="root"></div>

  <!--
    All CDN scripts are loaded SYNCHRONOUSLY so they are fully available
    before the inline <script> at the bottom runs.
  -->

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"        crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- prop-types — required peer dependency for Recharts UMD -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>

  <!-- Recharts — must come after React + prop-types -->
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <!-- Axios -->
  <script src="https://unpkg.com/axios@1.7.2/dist/axios.min.js"></script>

  <!-- Babel Standalone — transpiles JSX at runtime, no build step needed -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!--
    Manual fetch + Babel.transform() approach.
    More reliable than <script type="text/babel" src="..."> which has
    known async-loading issues in several browsers / Babel versions.
  -->
  <script>
    document.getElementById('boot-msg').textContent = 'Starting app…';

    fetch('/static/app.js')
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status + ' fetching /static/app.js');
        return res.text();
      })
      .then(function(src) {
        // Transpile JSX → plain JS
        var result = Babel.transform(src, { presets: ['react'] });

        // Inject as a regular script
        var script = document.createElement('script');
        script.text = result.code;
        document.body.appendChild(script);

        // Hide boot screen (React will paint the UI)
        var boot = document.getElementById('boot');
        if (boot) boot.style.display = 'none';
      })
      .catch(function(err) {
        document.getElementById('boot-msg').textContent = 'Error: ' + err.message;
        document.getElementById('boot').style.color = '#ef4444';
        console.error('[LMS] Failed to load app.js:', err);
      });
  </script>
</body>
</html>
